name: OpenWrt package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install syntax tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua-cjson lua-check shellcheck

      - name: Shell syntax
        run: |
          sh -n luci-app-singboxwall/root/etc/init.d/singboxwall
          sh -n luci-app-singboxwall/root/etc/uci-defaults/99-singboxwall
          sh -n luci-app-singboxwall/root/usr/share/singboxwall/app.sh
          sh -n luci-app-singboxwall/root/usr/share/singboxwall/lib/common.sh

      - name: Lua syntax
        run: |
          luac5.1 -p luci-app-singboxwall/root/usr/share/singboxwall/generate.lua
          luac5.1 -p luci-app-singboxwall/root/usr/share/singboxwall/rules.lua
          luac5.1 -p luci-app-singboxwall/root/usr/share/singboxwall/status.lua
          luac5.1 -p luci-app-singboxwall/root/usr/share/singboxwall/backup.lua
          luac5.1 -p luci-app-singboxwall/root/usr/share/singboxwall/subscribe.lua

      - name: ucode syntax
        run: |
          if command -v ucode >/dev/null 2>&1; then ucode -c luci-app-singboxwall/root/usr/share/rpcd/ucode/singboxwall.uc; else echo 'SKIP ucode: compiler not available on runner'; fi

      - name: Package tests
        run: |
          luci-app-singboxwall/tests/run-tests.sh

  openwrt-package:
    name: OpenWrt 23.05 SDK packaging
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Fetch OpenWrt 23.05 SDK
        run: |
          wget -q https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xf openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          mv openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64 sdk

      - name: Install package into SDK
        run: |
          cp -a luci-app-singboxwall sdk/package/luci-app-singboxwall

      - name: Pin OpenWrt release feeds
        working-directory: sdk
        run: |
          cp feeds.conf.default feeds.conf.default.orig
          printf '%s\n' \
            'src-git packages https://git.openwrt.org/feed/packages.git^b5ed85f6e' \
            'src-git luci https://git.openwrt.org/project/luci.git^63ba3cba5b' \
            'src-git routing https://git.openwrt.org/feed/routing.git^e351d1e' \
            'src-git telephony https://git.openwrt.org/feed/telephony.git^98c8a5a' \
            > feeds.conf.default

      - name: Verify package metadata and payload
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          touch .config
          make defconfig


          # This package repository owns luci-app-singboxwall packaging. The SDK
          # smoke test intentionally verifies package metadata and payload only.
          # Keep the SDK config at its default selection: selecting this package
          # through defconfig would build the full runtime dependency closure
          # (luci-base, sing-box, nftables, kernel modules), which belongs to
          # OpenWrt image/feed integration testing.
          make package/luci-app-singboxwall/clean V=s CONFIG_PACKAGE_luci-app-singboxwall=m
          make package/luci-app-singboxwall/compile V=s CONFIG_PACKAGE_luci-app-singboxwall=m

          pkgroot="$(echo build_dir/target-*/luci-app-singboxwall/ipkg-all/luci-app-singboxwall)"
          test -d "$pkgroot"
          test -f "$pkgroot/etc/config/singboxwall"
          test -x "$pkgroot/etc/init.d/singboxwall"
          test -f "$pkgroot/usr/share/rpcd/ucode/singboxwall.uc"
          test -f "$pkgroot/usr/share/luci/menu.d/luci-app-singboxwall.json"
          test -f "$pkgroot/usr/share/rpcd/acl.d/luci-app-singboxwall.json"
          test -d "$pkgroot/usr/share/singboxwall"
          test -f "$pkgroot/www/luci-static/resources/singboxwall/common.js"
          test -d "$pkgroot/www/luci-static/resources/view/singboxwall"
          find "$pkgroot" -type f | sort
