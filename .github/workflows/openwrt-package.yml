name: OpenWrt package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install syntax tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua-cjson lua-check shellcheck

      - name: Shell syntax
        run: |
          sh -n luci-app-singboxwall/root/etc/init.d/singboxwall
          sh -n luci-app-singboxwall/root/etc/uci-defaults/99-singboxwall
          sh -n luci-app-singboxwall/root/usr/share/singboxwall/app.sh
          sh -n luci-app-singboxwall/root/usr/share/singboxwall/lib/common.sh

      - name: Lua syntax
        run: |
          luac5.1 -p luci-app-singboxwall/root/usr/share/singboxwall/generate.lua
          luac5.1 -p luci-app-singboxwall/root/usr/share/singboxwall/rules.lua
          luac5.1 -p luci-app-singboxwall/root/usr/share/singboxwall/status.lua
          luac5.1 -p luci-app-singboxwall/root/usr/share/singboxwall/backup.lua
          luac5.1 -p luci-app-singboxwall/root/usr/share/singboxwall/subscribe.lua

      - name: ucode syntax
        run: |
          if command -v ucode >/dev/null 2>&1; then ucode -c luci-app-singboxwall/root/usr/share/rpcd/ucode/singboxwall.uc; else echo 'SKIP ucode: compiler not available on runner'; fi

      - name: Package tests
        run: |
          luci-app-singboxwall/tests/run-tests.sh

  sdk-package-metadata:
    name: OpenWrt 23.05 SDK package metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      SDK_URL: https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
      SDK_SHA256: 9e5b6813a3f810123391f5f3ea10dfd1c14be1a880f410c70ec4424bbd1573d2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget xz-utils

      - name: Download OpenWrt SDK
        run: |
          wget -O openwrt-sdk.tar.xz "$SDK_URL"
          echo "$SDK_SHA256  openwrt-sdk.tar.xz" | sha256sum -c -
          mkdir sdk
          tar -xJf openwrt-sdk.tar.xz -C sdk --strip-components=1

      - name: Install package into LuCI feed
        run: |
          printf '%s\n' \
            'src-git packages https://git.openwrt.org/feed/packages.git^b5ed85f6e' \
            'src-git luci https://git.openwrt.org/project/luci.git^63ba3cba5b' \
            > sdk/feeds.conf
          cd sdk
          ./scripts/feeds update -a
          rm -rf feeds/luci/applications/luci-app-singboxwall
          mkdir -p feeds/luci/applications
          cp -a ../luci-app-singboxwall feeds/luci/applications/
          ./scripts/feeds update -i luci
          ./scripts/feeds install luci-app-singboxwall

      - name: Verify package metadata resolves
        working-directory: sdk
        run: |
          make defconfig
          grep -q '^CONFIG_PACKAGE_luci-app-singboxwall' tmp/.config-package.in
